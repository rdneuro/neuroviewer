name: Release

# Push a tag like v0.1.0 to build the sdist + wheel, publish them to PyPI
# (trusted publishing, no token stored in GitHub) and attach an AppImage to
# the GitHub release. See RELEASING.md for the one-time PyPI setup.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/neuroviewer/__init__.py)
          test "v${v}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version ${v}"; exit 1; }
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: dist
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/neuroviewer/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  appimage:
    needs: dist
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build tools and X11 fallback libraries
        run: sudo apt-get update && sudo apt-get install -y libfuse2 libxcb-cursor0 libxcb-image0 libxcb-render-util0 libxcb-util1
      - name: Build AppImage
        run: bash packaging/appimage/build_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: Neuroviewer-*.AppImage
      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Neuroviewer-*.AppImage
          generate_release_notes: true
